name: Android Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # 生成发布说明要对比上一个版本的标签，浅克隆里没有历史标签可用。
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the x.y.z format." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${KEYSTORE}" || -z "${STORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "Configure the four Android signing secrets documented in README.md." >&2
            exit 1
          fi

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/sextant-release.jks"

      - name: Run unit tests
        run: ./gradlew :android:app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/sextant-release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :android:app:assembleRelease --no-daemon

      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/sextant-${VERSION}.apk"
          cd release
          sha256sum "sextant-${VERSION}.apk" > "sextant-${VERSION}.apk.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sextant-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      # 守住 versionCode 单调递增。Android 只允许 versionCode 不低于已安装版本，更低会被
      # 安装器拒绝，而用户看到的只有一句「应用未安装」——不查这里根本不知道原因。
      - name: Assert versionCode does not go backwards
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # 必须和 android/app/build.gradle.kts 的 versionCodeFrom 保持同一套规则。
          # 两边一旦分叉，这条断言会失败——这正是它存在的意义。
          code_from() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            echo $(( major * 10000 + minor * 100 + patch ))
          }

          new_code=$(code_from "${VERSION}")
          previous_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')

          if [[ -z "${previous_tag}" ]]; then
            echo "No previous release; ${new_code} is the first versionCode."
            exit 0
          fi

          previous_code=$(code_from "${previous_tag#v}")
          if (( new_code <= previous_code )); then
            echo "versionCode would go backwards: ${previous_tag} already published ${previous_code}, this tag derives ${new_code}." >&2
            echo "Android refuses a lower versionCode; ship a higher version instead." >&2
            exit 1
          fi
          echo "versionCode ${previous_code} (${previous_tag}) -> ${new_code} (v${VERSION})."

      # Release 正文由上一个版本标签到本次标签之间的提交生成，按 conventional commit
      # 的类型分节。不用 --generate-notes 是因为它按「合并进默认分支的 PR」列举条目，而
      # 本仓库的 PR 都合进 dev、默认分支 main 早就停更，v0.4.2~v0.4.4 的正文都只剩一行
      # Full Changelog。
      - name: Build release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          previous_tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [[ -n "${previous_tag}" ]]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi

          work="${RUNNER_TEMP}/release-notes"
          mkdir -p "${work}"

          # 正则放进变量再匹配：直接写字面量的话，未加引号的 ")" 会被 bash 当成语法错误。
          subject_re='^([A-Za-z]+)(\(([^)]*)\))?!?:[[:space:]]+(.*)$'

          git log --no-merges --pretty=format:'%s' "${range}" > "${work}/subjects.txt"
          while IFS= read -r subject || [[ -n "${subject}" ]]; do
            [[ -z "${subject}" ]] && continue
            if [[ "${subject}" =~ ${subject_re} ]]; then
              type=$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')
              scope="${BASH_REMATCH[3]}"
              text="${BASH_REMATCH[4]}"
            else
              type="other"
              scope=""
              text="${subject}"
            fi
            case "${type}" in
              feat|fix|perf|refactor|ui|docs|test|build|ci|chore|revert) ;;
              *) type="other" ;;
            esac
            if [[ -n "${scope}" ]]; then
              printf -- '- **%s**: %s\n' "${scope}" "${text}" >> "${work}/${type}.txt"
            else
              printf -- '- %s\n' "${text}" >> "${work}/${type}.txt"
            fi
          done < "${work}/subjects.txt"

          emit() {
            [[ -s "${work}/$1.txt" ]] || return 0
            printf '### %s\n\n' "$2"
            cat "${work}/$1.txt"
            printf '\n'
          }

          {
            # Release 标题和应用更新弹窗已显示版本号，正文只保留更新内容。
            if [[ -z "${previous_tag}" ]]; then
              printf '首个正式版本。\n\n'
            fi
            emit feat "✨ 新功能"
            emit fix "🐛 问题修复"
            emit perf "⚡ 性能"
            emit refactor "♻️ 重构"
            emit ui "🎨 界面"
            emit docs "📝 文档"
            emit test "✅ 测试"
            emit build "🔧 构建"
            emit ci "🤖 CI"
            emit chore "🧹 杂项"
            emit revert "⏪ 回滚"
            emit other "📦 其他"
          } > "${work}/release-notes.md"

          echo "----- release notes -----"
          cat "${work}/release-notes.md"
          echo "notes_file=${work}/release-notes.md" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: gh release create "${RELEASE_TAG}" release/* --verify-tag --notes-file "${NOTES_FILE}" --title "Sextant ${RELEASE_TAG}"
